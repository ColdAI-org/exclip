<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12141a"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
    <!-- Cuts route one where route two passes over it: two chains crossing without a bridge. -->
    <mask id="gap">
      <rect width="32" height="32" fill="#fff"/>
      <path d="M9 23 C 13 19, 19 13, 23 9" stroke="#000" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    </mask>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="31" height="31" rx="7.5" fill="none" stroke="rgba(255,255,255,.1)"/>
  <path d="M9 9 C 13 13, 19 19, 23 23" stroke="#2563EB" stroke-width="3.6" stroke-linecap="round" fill="none" mask="url(#gap)"/>
  <path d="M9 23 C 13 19, 19 13, 23 9" stroke="#00B4F0" stroke-width="3.6" stroke-linecap="round" fill="none"/>
  <circle cx="9" cy="9" r="1.6" fill="#2563EB"/>
  <circle cx="23" cy="9" r="1.6" fill="#00B4F0"/>
</svg>
